version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stockflow-db
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: root
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - ./backend/migrations/000001_init_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d stockflow']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockflow-backend
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgres://root:postgres@postgres:5432/stockflow?sslmode=disable
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stockflow-frontend
    ports:
      - '5173:5173'
    depends_on:
      - backend

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
